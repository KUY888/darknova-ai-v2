name: Build Android APK (TWA)

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PWA_URL: https://darknova-ai-v2.onrender.com
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Check PWA manifest is reachable (warning only)
        continue-on-error: true
        run: |
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors --max-time 60 "$PWA_URL/manifest.webmanifest" | head -c 400

      - name: Restore debug keystore (optional, keeps signing fingerprint stable)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Using keystore from secret DEBUG_KEYSTORE_BASE64"
          else
            echo "No DEBUG_KEYSTORE_BASE64 secret: Gradle will generate a temporary debug keystore"
          fi

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Show signing SHA-256 fingerprint
        run: |
          {
            echo "### Debug signing SHA-256 (for Digital Asset Links)"
            echo '```'
            keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA256:"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk darknova-ai-v2-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: darknova-ai-v2-debug-apk
          path: darknova-ai-v2-debug.apk
          if-no-files-found: error
          retention-days: 30
