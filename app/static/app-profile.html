<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>DARKNOVA AI V2</title>
<style>
:root{--bg:#07070d;--card:#101020;--red:#ff2a4d;--vio:#8a5cff;--tx:#e8e8f4;--mut:#8a8aa8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;
background:radial-gradient(circle at 50% 0,#1a1030,var(--bg) 60%);color:var(--tx);font-family:system-ui,sans-serif}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid #2a2040;border-radius:20px;padding:24px;
text-align:center;box-shadow:0 0 40px #8a5cff33}
h1{margin:8px 0 0;letter-spacing:3px}.v{color:var(--red);font-weight:700}
.logo{width:160px;height:160px;border-radius:50%;object-fit:cover;margin:16px auto;display:block;border:2px solid var(--red);box-shadow:0 0 24px #ff2a4d66}
.row{display:flex;justify-content:space-between;padding:8px 14px;background:#0b0b16;border-radius:10px;margin:6px 0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#555;margin-right:8px}
.online .dot{background:#2cff8a}.offline .dot{background:var(--red)}
.mut{color:var(--mut);font-size:.85rem}.btns{display:grid;gap:8px;margin-top:16px}
button,a.b{padding:12px;border-radius:10px;border:1px solid var(--vio);background:transparent;color:var(--tx);font-size:1rem;text-decoration:none;cursor:pointer}
button:hover,a.b:hover{background:var(--vio)}pre{white-space:pre-wrap;text-align:left;font-size:.8rem;color:var(--mut)}
</style></head><body><div class="card">
<h1>DARKNOVA AI</h1><div class="v">V2</div><img class="logo" src="/static/logo.jpg" alt="DARKNOVA COMMUNITY">
<div class="mut" id="type">AI Assistant</div><div id="st" style="margin-top:12px"></div>
<div class="mut" style="margin-top:12px">Developer</div><div id="dev">…</div>
<div class="btns"><button onclick="show('about')">About</button><button onclick="show('status')">System Status</button>
<a class="b" id="dc" target="_blank" rel="noopener">Discord</a><a class="b" id="gh" target="_blank" rel="noopener" hidden>GitHub</a></div>
<pre id="out"></pre></div>
<script>
const g=async u=>(await fetch(u)).json();let A,S;
const row=(n,s)=>`<div class="row ${s}"><span><i class="dot"></i>${n}</span><b>${s}</b></div>`;
async function load(){try{[A,S]=(await Promise.all([g('/system/about'),g('/system/status')])).map(r=>r.data);
dev.textContent=A.developer;type.textContent=A.app_type;dc.href=A.discord;if(A.github){gh.href=A.github;gh.hidden=false}
st.innerHTML=row('API',S.api)+row('Database',S.database)+row('AI Provider',S.ai)}
catch(e){st.innerHTML=row('API','offline')}}
function show(w){out.textContent=w=='about'?`${A.about}\n\nDeveloper: ${A.developer}\nCommunity: ${A.community}\nDiscord: ${A.discord}`
:JSON.stringify(S,null,2)}
load();
</script></body></html>
