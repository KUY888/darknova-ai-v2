<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DARKNOVA AI V2</title>
<meta name="theme-color" content="#0d0d12"><meta name="description" content="DARKNOVA AI V2 — AI Assistant">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DARKNOVA"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#0d0d12;--sb:#111118;--card:#17171f;--bd:#262633;--tx:#ececf3;--mut:#8b8ba3;--red:#ff2a4d;--vio:#8a5cff;--g:linear-gradient(135deg,#ff2a4d,#8a5cff)}
*{box-sizing:border-box}html,body{height:100%;margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px}
input,textarea,select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;outline:none}
input:focus,textarea:focus{border-color:var(--vio)}button{cursor:pointer}button:hover{background:#20202c}
.pri{background:var(--g);border:0;color:#fff;font-weight:600}.pri:hover{background:var(--g);opacity:.9}
#auth{min-height:100%;display:grid;place-items:center;padding:16px}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:26px;text-align:center}
.box img.lg{width:96px;height:96px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--red),0 0 28px #ff2a4d55}
.box h1{margin:10px 0 0;letter-spacing:3px;font-size:1.5rem}.box .v{color:var(--red);font-weight:700}
.box input{width:100%;margin:6px 0}.tabs{display:flex;gap:8px;margin:14px 0 6px}.tabs button{flex:1}.tabs .on{background:var(--vio);border-color:var(--vio)}
.err{color:#ff7a8e;min-height:1.3em;font-size:.9rem;margin:6px 0}
#app{height:100%;display:flex}
#side{width:272px;background:var(--sb);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:12px;gap:10px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:1px;padding:4px}.brand img{width:32px;height:32px;border-radius:50%;object-fit:cover}
#new{display:flex;gap:8px;justify-content:center;border-radius:12px}
#list{flex:1;overflow:auto;margin:0 -4px}.it{display:flex;align-items:center;gap:4px;padding:10px;margin:2px 4px;border-radius:10px;cursor:pointer;color:#c9c9d8}
.it:hover,.it.on{background:var(--card);color:var(--tx)}.it span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.93rem}
.it b{font-weight:400;opacity:0;padding:2px 6px}.it:hover b,.it.on b{opacity:.7}.it b:hover{opacity:1}@media(hover:none){.it b{opacity:.6}}
#me{display:flex;align-items:center;gap:10px;text-align:left;border-radius:12px}#me img{width:30px;height:30px;border-radius:50%;object-fit:cover}#me span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
#bar{display:flex;align-items:center;gap:10px;padding:10px 14px}#bar #ttl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
#menu{display:none;padding:8px 12px}#mode{border-radius:20px;padding:7px 12px;font-size:.9rem}
#scroll{flex:1;overflow:auto;scroll-behavior:smooth}#col{max-width:760px;margin:0 auto;padding:8px 16px 24px;display:flex;flex-direction:column;gap:22px}
#hello{max-width:760px;margin:0 auto;padding:8vh 16px 0;text-align:center}
#hello img{width:72px;height:72px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--red),0 0 30px #8a5cff66}
#hello h2{font-size:1.7rem;margin:16px 0 4px}#hello p{color:var(--mut);margin:0 0 24px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px;margin:0 auto}.chips button{padding:14px;text-align:left;border-radius:14px}
.row{display:flex;gap:12px}.row.user{justify-content:flex-end}
.av{width:30px;height:30px;border-radius:50%;object-fit:cover;flex-shrink:0;margin-top:2px}
.ub{background:#252536;padding:10px 16px;border-radius:20px 20px 4px 20px;max-width:85%;white-space:pre-wrap;word-wrap:break-word;line-height:1.55}
.ab{flex:1;min-width:0;line-height:1.7;word-wrap:break-word}.ab p{margin:0 0 .8em}.ab>*:last-child{margin-bottom:0}
.ab h3,.ab h4,.ab h5{margin:1em 0 .4em}.ab ul,.ab ol{margin:0 0 .8em;padding-left:1.4em}.ab a{color:#a78bff}
.ab code{background:#22222f;padding:2px 6px;border-radius:6px;font-size:.88em;font-family:ui-monospace,Menlo,monospace}
.cb{background:#0a0a10;border:1px solid var(--bd);border-radius:12px;margin:0 0 .9em;overflow:hidden}
.ch{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 14px;background:#15151e;color:var(--mut);font-size:.8rem}
.ch button{padding:3px 10px;font-size:.78rem;border-radius:8px}.cb pre{margin:0;padding:12px 14px;overflow-x:auto}
.cb pre code{background:none;padding:0;font-size:.85rem;line-height:1.55;white-space:pre}
.er{color:#ff7a8e}.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--mut);animation:b 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}@keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}
#dock{padding:8px 14px calc(10px + env(safe-area-inset-bottom,0px))}
#comp{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:26px;padding:8px 8px 8px 18px}
#comp:focus-within{border-color:var(--vio)}#in{flex:1;resize:none;border:0;background:transparent;padding:8px 0;max-height:160px;line-height:1.5}
#send{width:40px;height:40px;border-radius:50%;padding:0;font-size:1.2rem;flex-shrink:0}#send:disabled{opacity:.4}
.note{text-align:center;color:var(--mut);font-size:.72rem;margin-top:8px}
#bd{display:none}
#prof{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:20}
#prof .box{text-align:left;max-height:92vh;overflow:auto}#prof .box input,#prof .box textarea{width:100%;margin:4px 0 10px}
.st{display:flex;gap:8px;text-align:center;margin:10px 0}.st div{flex:1;background:var(--bg);border-radius:12px;padding:8px}
@media(max-width:760px){#menu{display:block}#side{position:fixed;top:0;bottom:0;left:0;width:82%;max-width:300px;z-index:10;transform:translateX(-100%);transition:.2s}
#side.open{transform:none}#bd.on{display:block;position:fixed;inset:0;background:#0009;z-index:9}.chips{grid-template-columns:1fr}#hello{padding-top:5vh}.ub{max-width:90%}}
</style></head><body>

<div id="auth" hidden><div class="box">
<img class="lg" src="/static/logo.jpg" alt="DARKNOVA"><h1>DARKNOVA AI</h1><div class="v">V2</div>
<div class="tabs"><button id="tl" class="on">เข้าสู่ระบบ</button><button id="tr">สมัครสมาชิก</button></div>
<input id="u" placeholder="Username หรือ Email" autocomplete="username">
<input id="em" type="email" placeholder="Email" hidden>
<input id="pw" type="password" placeholder="รหัสผ่าน (อย่างน้อย 8 ตัว)" autocomplete="current-password">
<button class="pri" id="go" style="width:100%;margin-top:6px;padding:12px">เข้าสู่ระบบ</button><div class="err" id="err"></div>
<a href="/app-profile" style="color:var(--mut);font-size:.85rem">About DARKNOVA AI</a></div></div>

<div id="app" hidden><div id="bd"></div>
<aside id="side"><div class="brand"><img src="/static/logo.jpg" alt="">DARKNOVA AI</div>
<button class="pri" id="new">＋ แชทใหม่</button><input id="q" placeholder="ค้นหาแชท…"><div id="list"></div>
<button id="inst" hidden>📲 ติดตั้งแอป</button>
<button id="me"><img id="mav" src="/static/logo.jpg" alt=""><span id="mnm">โปรไฟล์</span>⚙</button></aside>
<section id="main"><div id="bar"><button id="menu">☰</button><div id="ttl">แชทใหม่</div>
<select id="mode"><option>CHAT</option><option>CODE</option><option>DEBUG</option><option>PLAN</option></select></div>
<div id="scroll"><div id="hello"></div><div id="col"></div></div>
<div id="dock"><div id="comp"><textarea id="in" rows="1" placeholder="ถาม DARKNOVA AI…"></textarea><button class="pri" id="send">↑</button></div>
<div class="note">DARKNOVA AI อาจตอบผิดพลาดได้ โปรดตรวจสอบข้อมูลสำคัญ</div></div></section></div>

<div id="prof" hidden><div class="box"><div style="text-align:center"><img class="lg" id="pa" src="/static/logo.jpg" alt=""></div>
<h3 id="pn" style="text-align:center;margin:10px 0 2px"></h3><div id="pm" style="text-align:center;color:var(--mut);font-size:.85rem"></div>
<div class="st"><div><b id="s1"></b><br><small>แชท</small></div><div><b id="s2"></b><br><small>ข้อความ</small></div><div><b id="s3"></b><br><small>AI ตอบ</small></div></div>
<small>Avatar (PNG/JPG/WEBP ≤2MB)</small><input type="file" id="af" accept="image/png,image/jpeg,image/webp">
<button id="ad" style="width:100%;margin-bottom:10px">ลบ Avatar</button>
<small>Username</small><input id="pu"><small>Display Name</small><input id="pd" maxlength="50">
<small>Bio</small><textarea id="pb" maxlength="300" rows="3"></textarea><div class="err" id="perr"></div>
<button class="pri" id="ps" style="width:100%;padding:12px">บันทึก</button>
<div style="display:flex;gap:8px;margin-top:8px"><button id="pl" style="flex:1">ออกจากระบบ</button><button id="pc" style="flex:1">ปิด</button></div></div></div>

<script>
/*MD*/
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function inl(s){s=esc(s);s=s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>');
 return s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')}
function blk(t){const o=[];let L=null,P=[];const fl=()=>{if(L){o.push(`<${L.t}>${L.i.join('')}</${L.t}>`);L=null}},fp=()=>{if(P.length){o.push('<p>'+P.join('<br>')+'</p>');P=[]}};
 for(const ln of t.split('\n')){let m;if(!ln.trim()){fp();fl();continue}
  if(m=ln.match(/^(#{1,3})\s+(.*)/)){fp();fl();const n=m[1].length+2;o.push(`<h${n}>${inl(m[2])}</h${n}>`)}
  else if(m=ln.match(/^\s*[-*]\s+(.*)/)){fp();if(!L||L.t!='ul'){fl();L={t:'ul',i:[]}}L.i.push('<li>'+inl(m[1])+'</li>')}
  else if(m=ln.match(/^\s*\d+[.)]\s+(.*)/)){fp();if(!L||L.t!='ol'){fl();L={t:'ol',i:[]}}L.i.push('<li>'+inl(m[1])+'</li>')}
  else{fl();P.push(inl(ln))}}fp();fl();return o.join('')}
function md(text){return text.split('```').map((p,i)=>{if(i%2==0)return blk(p);const nl=p.indexOf('\n');const lang=nl<0?'':p.slice(0,nl).trim().slice(0,20);const code=nl<0?p:p.slice(nl+1);
 return `<div class="cb"><div class="ch"><span>${esc(lang)||'code'}</span><button class="cp">คัดลอก</button></div><pre><code>${esc(code.replace(/\n$/,''))}</code></pre></div>`}).join('')}
/*END*/
const $=id=>document.getElementById(id);let token=localStorage.getItem('dn_token'),cur=null,reg=false,me=null,busy=false;
async function api(path,o={}){const h={};if(token)h.Authorization='Bearer '+token;let body=o.body;
 if(o.json){h['Content-Type']='application/json';body=JSON.stringify(o.json)}
 const r=await fetch(path,{method:o.method||'GET',headers:h,body});let j;try{j=await r.json()}catch(e){throw new Error('เซิร์ฟเวอร์ตอบกลับผิดรูปแบบ')}
 if(!j.success){if(r.status===401&&token&&!o.noLogout)logout();throw new Error(j.error||'เกิดข้อผิดพลาด')}return j.data}
function setReg(v){reg=v;$('tl').classList.toggle('on',!v);$('tr').classList.toggle('on',v);$('em').hidden=!v;
 $('u').placeholder=v?'Username (a-z, 0-9, _ 3-30 ตัว)':'Username หรือ Email';$('go').textContent=v?'สมัครสมาชิก':'เข้าสู่ระบบ';$('err').textContent=''}
$('tl').onclick=()=>setReg(false);$('tr').onclick=()=>setReg(true);
$('go').onclick=async()=>{$('err').textContent='';const u=$('u').value.trim(),p=$('pw').value;
 try{if(reg)await api('/auth/register',{method:'POST',json:{username:u,email:$('em').value.trim(),password:p}});
  const d=await api('/auth/login',{method:'POST',json:{identifier:u,password:p},noLogout:true});token=d.access_token;localStorage.setItem('dn_token',token);$('pw').value='';boot()}
 catch(e){$('err').textContent=e.message}};
$('pw').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
function logout(){if(token)fetch('/auth/logout',{method:'POST',headers:{Authorization:'Bearer '+token}}).catch(()=>{});
 token=null;cur=null;me=null;localStorage.removeItem('dn_token');$('prof').hidden=true;$('app').hidden=true;$('auth').hidden=false}
async function loadMe(){try{me=await api('/users/me');$('mnm').textContent=me.display_name||me.username;$('mav').src=me.avatar_url||'/static/logo.jpg'}catch(e){}}
async function boot(){$('auth').hidden=true;$('app').hidden=false;closeSide();await loadMe();loadList();newChat()}
const CHIPS=[{t:'💻 ช่วยเขียนโค้ด',m:'CODE',p:'ช่วยเขียนโค้ด '},{t:'🐞 หา Bug / อธิบาย Error',m:'DEBUG',p:'ช่วยหาสาเหตุ error นี้:\n'},
 {t:'🗺️ วางแผนโปรเจกต์',m:'PLAN',p:'ช่วยวางแผนโปรเจกต์ '},{t:'💬 คุยทั่วไป',m:'CHAT',p:'ช่วยอธิบาย '}];
function newChat(){cur=null;$('col').innerHTML='';$('ttl').textContent='แชทใหม่';const h=$('hello');h.hidden=false;
 h.innerHTML=`<img src="/static/logo.jpg" alt=""><h2></h2><p>วันนี้ให้ช่วยอะไรดี?</p><div class="chips"></div>`;
 h.querySelector('h2').textContent='สวัสดี'+(me?' '+(me.display_name||me.username):'');
 CHIPS.forEach(c=>{const b=document.createElement('button');b.textContent=c.t;b.onclick=()=>{$('mode').value=c.m;$('in').value=c.p;grow();$('in').focus()};h.querySelector('.chips').append(b)});markOn()}
function row(role,html,isText){$('hello').hidden=true;const r=document.createElement('div');r.className='row '+role;
 if(role==='user'){const b=document.createElement('div');b.className='ub';b.textContent=html;r.append(b)}
 else{const a=document.createElement('img');a.className='av';a.src='/static/logo.jpg';a.alt='';const b=document.createElement('div');b.className='ab';
  if(isText)b.textContent=html;else b.innerHTML=md(html);r.append(a,b)}
 $('col').append(r);$('scroll').scrollTop=1e9;return r.querySelector('.ab')||r}
async function loadList(){try{const s=$('q').value.trim();const rows=await api('/conversations'+(s?'?q='+encodeURIComponent(s):''));
 const L=$('list');L.innerHTML='';rows.forEach(c=>{const d=document.createElement('div');d.className='it';d.dataset.id=c.id;
 const t=document.createElement('span');t.textContent=c.title;const r=document.createElement('b');r.textContent='✎';const x=document.createElement('b');x.textContent='🗑';d.append(t,r,x);d.onclick=()=>openChat(c);
 r.onclick=async e=>{e.stopPropagation();const n=prompt('ชื่อแชทใหม่',c.title);if(n&&n.trim()){try{await api('/conversations/'+c.id,{method:'PATCH',json:{title:n.trim()}});loadList();if(cur===c.id)$('ttl').textContent=n.trim()}catch(er){alert(er.message)}}};
 x.onclick=async e=>{e.stopPropagation();if(confirm('ลบแชทนี้?')){try{await api('/conversations/'+c.id,{method:'DELETE'});if(cur===c.id)newChat();loadList()}catch(er){alert(er.message)}}};
 L.append(d)});markOn()}catch(e){}}
function markOn(){document.querySelectorAll('.it').forEach(i=>i.classList.toggle('on',+i.dataset.id===cur))}
async function openChat(c){cur=c.id;$('mode').value=c.mode;$('ttl').textContent=c.title;$('col').innerHTML='';closeSide();markOn();
 try{const ms=await api(`/conversations/${c.id}/messages`);ms.forEach(m=>row(m.role,m.content));if(!ms.length)$('hello').hidden=true}catch(e){row('assistant',e.message,true).className='ab er'}}
function grow(){const t=$('in');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,160)+'px'}
async function send(){const t=$('in').value.trim();if(!t||busy)return;busy=true;$('send').disabled=true;$('in').value='';grow();row('user',t);
 const w=row('assistant','',true);w.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';
 try{const d=await api('/chat',{method:'POST',json:{message:t,conversation_id:cur,mode:$('mode').value}});cur=d.conversation.id;$('ttl').textContent=d.conversation.title;w.innerHTML=md(d.reply.content);loadList()}
 catch(e){w.className='ab er';w.textContent=e.message}busy=false;$('send').disabled=false;$('scroll').scrollTop=1e9}
$('send').onclick=send;$('in').oninput=grow;$('in').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&innerWidth>760){e.preventDefault();send()}};
$('col').onclick=e=>{if(e.target.classList.contains('cp')){const code=e.target.closest('.cb').querySelector('code').textContent;
 (navigator.clipboard?navigator.clipboard.writeText(code):Promise.reject()).then(()=>{e.target.textContent='คัดลอกแล้ว ✓'},()=>{e.target.textContent='คัดลอกไม่ได้'});setTimeout(()=>e.target.textContent='คัดลอก',1500)}};
function closeSide(){$('side').classList.remove('open');$('bd').classList.remove('on')}
$('menu').onclick=()=>{$('side').classList.add('open');$('bd').classList.add('on')};$('bd').onclick=closeSide;$('new').onclick=()=>{newChat();closeSide()};
let tm;$('q').oninput=()=>{clearTimeout(tm);tm=setTimeout(loadList,300)};
async function showProf(){try{await loadMe();const u=me;$('pa').src=u.avatar_url||'/static/logo.jpg';$('pn').textContent=u.display_name||u.username;
 $('pm').textContent=`@${u.username} · ${u.email} · สมัคร ${u.created_at.slice(0,10)}`;$('s1').textContent=u.stats.conversations;$('s2').textContent=u.stats.messages;$('s3').textContent=u.stats.ai_replies;
 $('pu').value=u.username;$('pd').value=u.display_name;$('pb').value=u.bio;$('perr').textContent='';$('prof').hidden=false}catch(e){alert(e.message)}}
$('me').onclick=showProf;$('pc').onclick=()=>$('prof').hidden=true;$('pl').onclick=logout;
$('ps').onclick=async()=>{try{await api('/users/me',{method:'PATCH',json:{username:$('pu').value.trim(),display_name:$('pd').value,bio:$('pb').value}});showProf()}catch(e){$('perr').textContent=e.message}};
$('af').onchange=async()=>{const f=$('af').files[0];if(!f)return;const fd=new FormData();fd.append('file',f);
 try{await api('/users/me/avatar',{method:'POST',body:fd});showProf()}catch(e){$('perr').textContent=e.message}$('af').value=''};
$('ad').onclick=async()=>{try{await api('/users/me/avatar',{method:'DELETE'});showProf()}catch(e){$('perr').textContent=e.message}};
let dp=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('inst').hidden=false});
$('inst').onclick=async()=>{if(!dp)return;dp.prompt();try{await dp.userChoice}catch(e){}dp=null;$('inst').hidden=true};
addEventListener('appinstalled',()=>{$('inst').hidden=true});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
if(token)boot();else $('auth').hidden=false;
</script></body></html>
